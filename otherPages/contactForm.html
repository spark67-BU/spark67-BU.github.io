    <h1>Get In Touch With Me!</h1>
<div class="Form">
    <form id="ContactMeForm">
        <div>
        <label for="FirstName">First Name</label><br>
        <input id="FirstName" type="text" placeholder="First Name" class="textInput" required>
        <p id="erorMessageFirstName" class="errorMessage"></p>
        </div>


        <div>
        <label for="LastName">Last Name</label><br>
        <input id="LastName" type="text" placeholder="Last Name" class="textInput" required>
        <p id="erorMessageLastName" class="errorMessage"></p>
        </div>


        <div>
        <label for="EmailInput">Email</label><br>
        <input id="EmailInput" type="text" placeholder="example@example.com" class="textInput" required>
        <p id="erorMessageEmailInput" class="errorMessage"></p>
        </div>

        <div>
            <label for="TextInput">Reason for Contacting Me</label><br>
            <textarea id="TextInput" placeholder="I am contacting you because..."></textarea>
        </div>

         <div>
        <button type="button" id="submitForm" disabled class="submitButton">Submit</button>
        <p id="erorMessageSubmitForm" class="errorMessage"></p>
        </div>
    </form>
    </div>
    <footer>

</footer>
